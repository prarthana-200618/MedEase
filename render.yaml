services:
  - type: web
    name: medease-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production

      - key: AI_PROVIDER
        value: mock

      - key: TTS_PROVIDER
        value: browser

      - key: CORS_ORIGINS
        value: '["https://prarthana-200618.github.io"]'